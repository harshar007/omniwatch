[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnitrix-watch"
version = "0.1.0"
description = "A research companion and Omnitrix watch face platform for the Redmi Watch Move 2"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Omnitrix Watch Research Team" }
]
dependencies = [
    "bleak>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
omnitrix-watch = "omnitrix_watch.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

